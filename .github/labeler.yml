engine:
  - changed-files:
      - any-glob-to-any-file: src/engine/**
ui:
  - changed-files:
      - any-glob-to-any-file: ["src/ui/**", "index.html"]
data:
  - changed-files:
      - any-glob-to-any-file: ["data/**", "src/data/**", "scripts/**"]
tests:
  - changed-files:
      - any-glob-to-any-file: tests/**
ci:
  - changed-files:
      - any-glob-to-any-file: .github/**
dependencies:
  - changed-files:
      - any-glob-to-any-file: ["package.json", "pnpm-lock.yaml"]
