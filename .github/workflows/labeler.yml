name: Labeler

# pull_request (not pull_request_target): never runs with write access on fork code. Fork PRs get a
# read-only token, so they simply go unlabelled.
on:
  pull_request:

permissions:
  contents: read

jobs:
  label:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      # No checkout: the labeler reads .github/labeler.yml via the API.
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
